name: Feature CI

on:
  push:
    branches:
      - 'feature/**'
      - '!feature/wip'
    paths:
      - 'src/**'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  show-context:
    runs-on: ubuntu-latest
    steps:
      - name: Show commit and ref
        env:
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "Commit: $COMMIT_SHA"
          echo "Ref: $GITHUB_REF"
